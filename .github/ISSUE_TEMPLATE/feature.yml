name: Feature
description: A change or addition to the service.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a secret, a password, a token or a complete share link.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the need, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include what would need to change in the README, the migrations and the privacy policy or terms if it affects stored data.
