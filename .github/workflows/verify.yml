name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://secrets_ci:secrets_ci@127.0.0.1:5432/secrets_ci_test
      TEST_DATABASE_URL: postgres://secrets_ci:secrets_ci@127.0.0.1:5432/secrets_ci_test
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start isolated PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE secrets_ci LOGIN PASSWORD 'secrets_ci';"
          sudo -u postgres createdb -O secrets_ci secrets_ci_test
      - run: node scripts/migrate.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
